<article class="article-card">
  <div class="article-card-meta">
    <ul class="category-tags">
      {% for cat in article.categories %}
      <li class="category-tag category-tag--{{ cat | lower | replace(' ', '-') }}">{{ cat }}</li>
      {% endfor %}
    </ul>
    <span class="read-time">{{ article.read_time }} min read</span>
  </div>
  <h3 class="article-card-title">
    <a href="{{ url_for('article_page', slug=article.slug) }}">{{ article.title }}</a>
  </h3>
  <p class="article-card-excerpt">{{ article.excerpt }}</p>
  <div class="article-card-footer">
    <time datetime="{{ article.date }}">{{ article.date }}</time>
    <a href="{{ url_for('article_page', slug=article.slug) }}" class="article-read-more">Read article &rarr;</a>
  </div>
</article>
