<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog — {{ profile.name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  {% include '_theme_init.html' %}
</head>
<body>
  {% include '_navbar.html' %}

  <header class="page-header">
    <div class="page-header-inner">
      <p class="eyebrow">Blog</p>
      <h1>Articles</h1>
      <p class="page-summary">Thoughts on things I've learned while building with code.</p>
    </div>
  </header>

  <main class="blog-main">
    <div class="articles-grid">
      {% for article in articles %}
      {% include '_article_card.html' %}
      {% endfor %}
    </div>
  </main>

  <footer>
    <p>&copy; {{ profile.name }}. Built with Python &amp; Flask.</p>
  </footer>
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</body>
</html>
